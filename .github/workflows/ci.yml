name: CI

on:
  push:
    branches: [master, main, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (CGO disabled)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Spike
        run: go test -count=1 -v ./internal/spike ./internal/store
      - name: Two-node proof
        run: go test -count=1 -v ./internal/node -run TestTwoNodeAuthenticatedIntentAck

  build:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            GOOS: linux
            GOARCH: amd64
          - target: linux-arm64
            GOOS: linux
            GOARCH: arm64
          - target: darwin-amd64
            GOOS: darwin
            GOARCH: amd64
          - target: darwin-arm64
            GOOS: darwin
            GOARCH: arm64
          - target: windows-amd64
            GOOS: windows
            GOARCH: amd64
          - target: windows-arm64
            GOOS: windows
            GOARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.target }}
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o "dist/${{ matrix.target }}/rmm-agent-${{ matrix.target }}${suffix}" ./cmd/rmm-agent
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o "dist/${{ matrix.target }}/rmm-console-${{ matrix.target }}${suffix}" ./cmd/rmm-console
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o "dist/${{ matrix.target }}/rmm-pack-${{ matrix.target }}${suffix}" ./cmd/rmm-pack
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o "dist/${{ matrix.target }}/rmm-${{ matrix.target }}${suffix}" ./cmd/rmm
      - uses: actions/upload-artifact@v4
        with:
          name: rmm-${{ matrix.target }}-${{ github.sha }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
