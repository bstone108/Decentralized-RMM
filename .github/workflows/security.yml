name: Security

on:
  push:
    branches: [master, main, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      # Match go.mod's toolchain line. golang.org/x/crypto and golang.org/x/net
      # require Go 1.26.0; 1.26.8 is the latest patched 1.26 release.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
